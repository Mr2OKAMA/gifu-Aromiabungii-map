<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>クビアカツヤカミキリ被害報告</title>

<style>
body{
  max-width:800px;
  margin:10px auto;
  font-family:-apple-system, BlinkMacSystemFont, "Helvetica Neue", "Noto Sans JP", "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
  padding:16px;
  box-sizing:border-box;
}
label{font-weight:600;display:block;margin-bottom:6px}
.field{margin-bottom:14px}

input,select,textarea{
  width:100%;
  padding:10px;
  margin-top:4px;
  box-sizing:border-box;
  font-size:16px;
}

button{
  background:#c62828;
  color:white;
  border:none;
  padding:12px 20px;
  cursor:pointer;
  font-size:16px;
  border-radius:6px;
}

small.error{color:#b00020;display:none}
.checkbox-list{display:grid;gap:8px;margin-top:8px}
.checkbox-item{display:flex;align-items:flex-start;gap:8px}
.checkbox-item input{width:auto;margin-top:3px}
.helper{font-size:13px;color:#666;margin-top:6px}
.summary-box{background:#f6f6f6;padding:10px;border-radius:6px;margin-top:8px;font-size:14px}
.inline-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.coord-row{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}
.small-btn{
  white-space:nowrap;
  padding:10px 14px;
  font-size:14px;
}
.photo-choice{
  display:grid;
  gap:8px;
}
@media (max-width:480px){
  body{padding:12px;margin:0}
  h1{font-size:20px}
  input,select,textarea{font-size:18px}
  .inline-row,.coord-row{grid-template-columns:1fr}
  .small-btn{width:100%}
}
</style>
</head>

<body>

<h1>クビアカツヤカミキリ被害報告</h1>

<form id="reportForm" onsubmit="event.preventDefault(); createIssue();">

<div class="field">
<label>発見日</label>
<input type="date" id="date">
</div>

<div class="field">
<label>樹種</label>
<select id="species">
  <option>サクラ</option>
  <option>モモ</option>
  <option>ウメ</option>
  <option>スモモ</option>
  <option>その他</option>
</select>
</div>

<div class="field">
<label>症状・確認項目</label>
<div class="checkbox-list">
  <label class="checkbox-item"><input type="checkbox" id="frass"> フラスの有無</label>
  <label class="checkbox-item"><input type="checkbox" id="exitHole"> 脱出食痕の有無</label>
</div>
<div class="helper">※複数選択可</div>
</div>

<div class="field">
<label>駆除数</label>
<div class="inline-row">
  <div>
    <input id="removalCountValue" type="number" min="0" step="1" placeholder="数値で入力">
    <div class="helper">数値入力（例: 3）</div>
  </div>
  <div>
    <input id="removalCountNote" placeholder="補足（例: 3頭、10本の木で確認）">
    <div class="helper">自由記載（任意）</div>
  </div>
</div>
</div>

<div class="field">
<label>緯度・経度</label>
<div class="coord-row">
  <div>
    <input id="lat" inputmode="decimal" pattern="[0-9.+-]+" placeholder="緯度">
    <input id="lng" inputmode="decimal" pattern="[0-9.+-]+" placeholder="経度" style="margin-top:8px;">
  </div>
  <button type="button" id="locBtn" class="small-btn">現在位置を取得</button>
</div>
<div class="helper">※空欄のままでも入力できます。現在位置を取得すると自動入力されます。</div>
</div>

<div class="field">
<label>住所</label>
<input id="address" placeholder="例: 岐阜市〇〇町1-2-3">
<div class="helper">※市町村の自動集計に使います。できるだけ正確に入力してください。</div>
</div>

<div class="field">
<label>写真</label>
<div class="photo-choice">
  <div>
    <label class="helper" style="margin-top:0;">写真URL (任意)</label>
    <input id="photoUrl" placeholder="https://...">
  </div>
  <div>
    <label class="helper">写真ファイルを選択 (任意)</label>
    <input type="file" id="photoFile" accept="image/*">
  </div>
</div>
<div class="helper">※GitHub Issueでは画像そのものの直接添付は難しいため、URLまたはファイル名を記録します。</div>
</div>

<div class="field">
<label>備考</label>
<textarea id="memo" rows="4"></textarea>
<div class="summary-box" id="severityPreview">分類: -</div>
</div>

<div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
  <button type="submit">GitHubへ報告</button>
</div>

<p style="margin-top:12px;font-size:13px;color:#666">
※報告するとIssueが作成され、管理者が確認して地図へ反映します。
</p>

</form>

<small class="error" id="error"></small>

<script>
(function(){
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2,'0');
  const day = String(d.getDate()).padStart(2,'0');
  document.getElementById('date').value = `${y}-${m}-${day}`;
})();

const errEl = document.getElementById('error');
const previewEl = document.getElementById('severityPreview');
const frassEl = document.getElementById('frass');
const exitHoleEl = document.getElementById('exitHole');
const removalCountValueEl = document.getElementById('removalCountValue');
const removalCountNoteEl = document.getElementById('removalCountNote');
const photoUrlEl = document.getElementById('photoUrl');
const photoFileEl = document.getElementById('photoFile');

function showError(msg){
  errEl.textContent = msg;
  errEl.style.display = 'block';
  setTimeout(() => errEl.style.display = 'none', 6000);
}

function getRemovalCountValue(){
  const raw = removalCountValueEl.value.trim();
  if (!raw) return null;
  const n = Number(raw);
  return Number.isFinite(n) ? n : null;
}

function classifySeverity(){
  const signals = [frassEl.checked, exitHoleEl.checked].filter(Boolean).length;
  const count = getRemovalCountValue();

  let severity = '要注意';
  if (signals >= 2) severity = '重度';
  else if (signals === 1 && count !== null && count >= 1) severity = '中程度';
  else if (signals === 1 || (count !== null && count >= 1)) severity = '軽微';

  previewEl.textContent = `分類: ${severity}`;
  return severity;
}

[frassEl, exitHoleEl, removalCountValueEl].forEach(el => {
  el.addEventListener('change', classifySeverity);
  el.addEventListener('input', classifySeverity);
});
classifySeverity();

document.getElementById('locBtn').addEventListener('click', () => {
  if (!navigator.geolocation) {
    showError('このブラウザは位置情報に対応していません');
    return;
  }

  const btn = document.getElementById('locBtn');
  btn.textContent = '取得中...';

  navigator.geolocation.getCurrentPosition(
    (pos) => {
      document.getElementById('lat').value = pos.coords.latitude;
      document.getElementById('lng').value = pos.coords.longitude;
      btn.textContent = '現在位置を取得';
    },
    (err) => {
      console.error(err);
      showError('位置情報の取得に失敗しました。位置情報の許可を確認してください。');
      btn.textContent = '現在位置を取得';
    },
    { enableHighAccuracy: true, timeout: 10000 }
  );
});

function createIssue(){
  const species = document.getElementById('species').value.trim();
  const lat = document.getElementById('lat').value.trim();
  const lng = document.getElementById('lng').value.trim();
  const address = document.getElementById('address').value.trim();
  const memo = document.getElementById('memo').value.trim();
  const photoUrl = photoUrlEl.value.trim();
  const date = document.getElementById('date').value;
  const frass = frassEl.checked ? 'あり' : 'なし';
  const exitHole = exitHoleEl.checked ? 'あり' : 'なし';
  const removalCountValue = getRemovalCountValue();
  const removalCountNote = removalCountNoteEl.value.trim();
  const severity = classifySeverity();

  if (!date) { showError('発見日を入力してください'); return; }
  if (!species) { showError('樹種を入力してください'); return; }

  if (removalCountValue !== null && removalCountValue < 0) {
    showError('駆除数は0以上で入力してください');
    return;
  }

  if (lat && (isNaN(Number(lat)) || Number(lat) < -90 || Number(lat) > 90)) {
    showError('緯度の値が正しくありません');
    return;
  }
  if (lng && (isNaN(Number(lng)) || Number(lng) < -180 || Number(lng) > 180)) {
    showError('経度の値が正しくありません');
    return;
  }

  const photoFile = photoFileEl.files && photoFileEl.files[0] ? photoFileEl.files[0].name : '';
  const photoSource = photoUrl || (photoFile ? `file:${photoFile}` : '');

  const body =
`発見日:${date}

樹種:${species}

住所:${address}

フラス:${frass}

脱出食痕:${exitHole}

駆除数:${removalCountValue !== null ? removalCountValue : ''}

駆除数補足:${removalCountNote}

分類:${severity}

緯度:${lat}

経度:${lng}

備考:${memo}

写真URL:${photoSource}`;

  const url = `https://github.com/Mr2OKAMA/gifu-Aromiabungii-map/issues/new?title=被害報告&body=${encodeURIComponent(body)}`;
  window.open(url, '_blank');
}
</script>

</body>
</html>
